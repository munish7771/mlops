# This GitHub workflow deploys Bundle resources (ML resource config and more)
# defined under sample_project/resources/*
# and sample_project/databricks.yml with dev deployment target configs,
# when PRs are pushed into the dev branch
name: Bundle Deployment for sample_project Dev

on:
  push:
    branches:
      - 'dev'
  workflow_dispatch:

defaults:
  run:
    working-directory: ./sample_project

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  # ARM_TENANT_ID: ${{ secrets.AZURE_SP_TENANT_ID }}
  # ARM_CLIENT_ID: ${{ secrets.AZURE_SP_APPLICATION_ID }}
  # ARM_CLIENT_SECRET: ${{ secrets.AZURE_SP_CLIENT_SECRET }}
  

jobs:
  dev:
    concurrency: sample_project-dev-bundle-job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v0.236.0
      - name: Validate Bundle For Dev
        id: validate
        run: |
          databricks bundle validate -t dev
      - name: Deploy Bundle to Dev
        id: deploy
        run: |
          databricks bundle deploy -t dev
