
common_permissions: &permissions
  permissions:
    - level: CAN_VIEW
      group_name: users

resources:
  jobs:
    write_feature_table_job:
      name: sample_project-write-feature-table-job_${bundle.target}

      tasks:
        - task_key: ComputeFAQFeatures
          notebook_task:
            notebook_path: ../feature_engineering/notebooks/GenerateAndWriteFeatures.py
            base_parameters:
              # We will generate synthetic data inline, so this path is a placeholder.
              input_table_path: /databricks-datasets/faqs
              input_start_date: ""
              input_end_date: ""
              timestamp_column: created_at
              output_table_name: ${var.catalog_name}.${var.schema_name}.faq_features
              features_transform_module: faq_features
              primary_keys: id
              # git source information of current ML resource deployment. It will be persisted as part of the workflow run
              git_source_info: url:${bundle.git.origin_url}; branch:${bundle.git.branch}; commit:${bundle.git.commit}
      schedule:
        quartz_cron_expression: "0 0 7 * * ?" # daily at 7am
        timezone_id: UTC
      <<: *permissions
      # If you want to turn on notifications for this job, please uncomment the below code,
      # and provide a list of emails to the on_failure argument.
      #
      #  email_notifications:
      #    on_failure:
      #      - first@company.com
      #      - second@company.com
