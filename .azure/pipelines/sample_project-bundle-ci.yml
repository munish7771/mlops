# This Azure pipeline validates Bundle config (ML resource config and more)
# defined under sample_project/resources/*
# and sample_project/databricks.yml, when PRs are merged into the main branch
name: Bundle validation for sample_project

trigger: none
pr:
  paths:
    include:
      - 'sample_project/**'

variables:
  - group: databricks-secrets # Ensure you create a Variable Group with DATABRICKS_HOST and DATABRICKS_TOKEN

pool:
  vmImage: 'ubuntu-latest'

jobs:
- job: staging
  displayName: 'Validate Staging'
  steps:
  - checkout: self

  - script: |
      curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
    displayName: 'Install Databricks CLI'

  - script: |
      databricks bundle validate -t staging > ../validate_output_staging.txt
    displayName: 'Validate Bundle For Staging'
    workingDirectory: './sample_project/'
    env:
      DATABRICKS_HOST: $(DATABRICKS_HOST)
      DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
      # ARM_TENANT_ID: $(AZURE_SP_TENANT_ID)
      # ARM_CLIENT_ID: $(AZURE_SP_APPLICATION_ID)
      # ARM_CLIENT_SECRET: $(AZURE_SP_CLIENT_SECRET)

  # Note: To post comments back to the PR in ADO, it requires Azure DevOps REST API calls
  # or third-party extensions. For now we just print the output.
  - script: |
      cat ../validate_output_staging.txt
    displayName: 'Staging Validation Output'
    workingDirectory: './sample_project/'

- job: prod
  displayName: 'Validate Prod'
  steps:
  - checkout: self

  - script: |
      curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
    displayName: 'Install Databricks CLI'

  - script: |
      databricks bundle validate -t prod > ../validate_output_prod.txt
    displayName: 'Validate Bundle For Prod'
    workingDirectory: './sample_project/'
    env:
      DATABRICKS_HOST: $(DATABRICKS_HOST)
      DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
      # ARM_TENANT_ID: $(AZURE_SP_TENANT_ID)
      # ARM_CLIENT_ID: $(AZURE_SP_APPLICATION_ID)
      # ARM_CLIENT_SECRET: $(AZURE_SP_CLIENT_SECRET)

  - script: |
      cat ../validate_output_prod.txt
    displayName: 'Prod Validation Output'
    workingDirectory: './sample_project/'
