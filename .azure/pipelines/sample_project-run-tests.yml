name: Feature and Training Unit and Integration Tests for sample_project

trigger: none
pr:
  paths:
    include:
      - 'sample_project/**'
      - '.azure/pipelines/sample_project-run-tests.yml'

variables:
  - group: databricks-secrets

pool:
  vmImage: 'ubuntu-latest'

jobs:
- job: unit_tests
  displayName: 'Unit Tests'
  variables:
    SPARK_LOCAL_IP: '127.0.0.1'
  steps:
  - checkout: self

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.10'
    displayName: 'Use Python 3.10'

  # Feature store tests bring up a local Spark session, so Java is required.
  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '11'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'
    displayName: 'Use JDK 11'

  # ADO does not have a built-in pip cache task as simple as Actions, 
  # skipping cache for pipeline portability, or use Cache@2 later if needed
  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install -r ../test-requirements.txt
    displayName: 'Install dependencies'
    workingDirectory: './sample_project/'

  - script: |
      pytest
    displayName: 'Run tests with pytest'
    workingDirectory: './sample_project/'

- job: integration_test
  displayName: 'Integration Test'
  dependsOn: unit_tests
  condition: succeeded()
  steps:
  - checkout: self

  - script: |
      curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
    displayName: 'Install Databricks CLI'

  - script: |
      databricks bundle validate -t test
    displayName: 'Validate Bundle For Test Target (Staging Workspace)'
    workingDirectory: './sample_project/'
    env:
      DATABRICKS_HOST: $(DATABRICKS_HOST)
      DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

  - script: |
      databricks bundle deploy -t test
    displayName: 'Deploy Bundle to Test Target (Staging Workspace)'
    workingDirectory: './sample_project/'
    env:
      DATABRICKS_HOST: $(DATABRICKS_HOST)
      DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

  - script: |
      databricks bundle run write_feature_table_job -t test
    displayName: 'Run Feature Engineering Workflow (Test Target)'
    workingDirectory: './sample_project/'
    env:
      DATABRICKS_HOST: $(DATABRICKS_HOST)
      DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

  - script: |
      databricks bundle run model_training_job -t test
    displayName: 'Run Training Workflow (Test Target)'
    workingDirectory: './sample_project/'
    env:
      DATABRICKS_HOST: $(DATABRICKS_HOST)
      DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
